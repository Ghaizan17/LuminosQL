[package]
name = "luminosql-core"
version = "0.1.0"
edition = "2021"
description = "Database abstraction core for LuminosQL (no GUI deps — testable with cargo alone)"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls", "json"] }
sha2 = "0.10"
keyring = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
